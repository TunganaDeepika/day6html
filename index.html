
<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>
</head>
<body>

<h1>Course Registration Form</h1>

<form>

<fieldset>
    <legend><b>Personal Details</b></legend>

    <br>
    First Name:
    <input type="text" name="firstname">
    <br><br>

    Surname:
    <input type="text" name="surname">
    <br><br>

    Mobile Number:
    <input type="tel" placeholder="Enter you Number">
    <br><br>

    Email:
    <input type="email">
    <br><br>

    Password:
    <input type="password">
    <br><br>

    Confirm Password:
    <input type="password">
    <br><br>

    Date of Birth:
    <select>
        <option>--Select Date--</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
        <option>2003</option>
        <option>2004</option>
    </select>
    <br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>

    Select Country:
    <select>
        <option>--Select Country--</option>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Canada</option>
    </select>
    <br><br>

    Upload Picture:
    <br><br>
    <input type="file">
    <br><br>

    <input type="reset">

</fieldset>

<br><br>

<fieldset>
    <legend><b>Course Details</b></legend>

    <br>
    Select Course:
    <select>
        <option>--Select Course--</option>
        <option>Python</option>
        <option>Java</option>
        <option>HTML</option>
        <option>SQL</option>
    </select>
    <br><br>

    Delivery Mode:
    <input type="radio" name="mode"> Online
    <input type="radio" name="mode"> Offline
    <br><br>

    Comments:
    <br>
    <textarea rows="7" cols="80"></textarea>
    <br><br>

    <input type="submit">

</fieldset>

</form>

</body>
</html>
